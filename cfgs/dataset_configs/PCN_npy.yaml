# PCN.yaml with the two point-cloud paths pointing to the float32 .npy copy written by
# tools/cache_pcn_to_npy.py; the reported PCN runs read this copy.
NAME: PCN
CATEGORY_FILE_PATH: data/PCN/PCN.json
N_POINTS: 16384
N_RENDERINGS: 8
PARTIAL_POINTS_PATH: data/PCN/%s/partial/%s/%s/%02d.npy
COMPLETE_POINTS_PATH: data/PCN/%s/complete/%s/%s.npy
CARS: FALSE
