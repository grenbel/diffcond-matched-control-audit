optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0001,
  weight_decay : 0.0005
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 21,
  lr_decay: 0.9,
  lowest_decay: 0.02
}}

bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 21,
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
            others: {subset: 'test'}}}

model : {
    NAME: AdaPoinTr_DiffCond,
    num_query: 512,
    num_points: 8192,
    center_num: [512, 256],
    global_feature_dim: 1024,
    encoder_type: graph,
    decoder_type: fc,
    use_vanilla_ranking: true,
    ce_lambda: 0,
    encoder_config: {
      embed_dim: 384,
      depth: 6,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn'],
      combine_style: 'concat',
    },
    decoder_config: {
      embed_dim: 384,
      depth: 8,
      num_heads: 6,
      k: 8,
      n_group: 2,
      mlp_ratio: 2.,
      self_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      self_attn_combine_style: 'concat',
      cross_attn_block_style_list: ['attn-graph', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn', 'attn'],
      cross_attn_combine_style: 'concat',
    }
}

total_bs : 48
step_per_update : 1
max_epoch : 30

consider_metric: CDL2

# v2b: ranking conditioning OFF + CE auxiliary OFF.
# This is the "pure gated injection" variant: the ONLY difficulty-conditioning
# path is q' = q + gate * proj(diff_emb), trained without auxiliary CE pressure.
#
# IMPORTANT: use_vanilla_ranking=true means forward()
# uses self.query_ranking(coarse) instead of self.diff_cond_query_ranking(coarse, diff_emb).
# However, the downstream argsort+gather is still non-differentiable, so
# self.query_ranking is EFFECTIVELY FROZEN at the warm-start weights --
# same as the matched vanilla which also uses argsort+gather.
# This makes v2b vs matched vanilla a clean ablation of GATED INJECTION ALONE.
#
# If v2b > matched vanilla: gated injection alone helps -> paper gets C3.
# If v2b ~ matched vanilla: gated injection neutral -> paper stays at C1+C2.
# If v2b < matched vanilla: gated injection hurts -> strongest negative finding.
# Eval: only oracle mode meaningful (predictor has no gradient signal).
