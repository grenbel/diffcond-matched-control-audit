optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0001,
  weight_decay : 0.0005
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 21,
  lr_decay: 0.9,
  lowest_decay: 0.02
}}

bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 21,
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}

# The reported PCN runs read the float32 .npy copy written by tools/cache_pcn_to_npy.py,
# so the dataset entries use cfgs/dataset_configs/PCN_npy.yaml. To read the official .pcd
# files instead, use cfgs/dataset_configs/PCN.yaml (the same point clouds up to float32 rounding).
dataset : {
  train : { _base_: cfgs/dataset_configs/PCN_npy.yaml,
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/PCN_npy.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/PCN_npy.yaml,
            others: {subset: 'test'}}}

model : {
  NAME: UpTrans,
  num_pred: 16384,
  num_seeds: 1024,
  seed_fea: 128,
  dim_feat: 512,
  num_dicts: 256,
  upscales: [1, 4, 4],
  l2_loss: 0
}

loss : {
  sparse_loss_weight: 1.0,
  dense_loss_weight: 1.0,
  dz_weight: 1.0,
  orth_weight: 1.0
}

total_bs : 16
step_per_update : 1
max_epoch : 30

consider_metric: CDL1

# Secondary (PCN lite) cross-backbone run. Matched-control protocol mirrors ShapeNet-55 main
# except PCN-native defaults: num_pred=16384, num_dicts=256 (vs 512 on SN55),
# upscales=[1,4,4] (vs [1,2,4]), l2_loss=0 (CDL1 consider_metric matches
# pretrained PCN config).
#
# Warm-start source: the pretrained ODGNet PCN checkpoint (400-epoch).
#
# Launch:
#   nohup python -u main.py --config cfgs/PCN_models/UpTrans.yaml \
#       --exp_name uptrans_vanilla_pcn_warmstart30_seed42 --seed 42 --val_freq 10 \
#       --start_ckpts <path-to-pretrained-PCN-checkpoint> \
#       > train_uptrans_vanilla_pcn_seed42.log 2>&1 &
